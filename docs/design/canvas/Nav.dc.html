<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header class="nav {{rootClass}}">
  <div class="wrap nav-in">
    <a class="logo" href="Main.dc.html" aria-label="Berk Certel, ana sayfa"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 21.5L5.6 20.2L16 25.4L26.4 20.2L29 21.5L16 28Z" fill="currentColor"></path><path d="M3 15.5L5.6 14.2L16 19.4L26.4 14.2L29 15.5L16 22Z" fill="currentColor"></path><path d="M16 3L29 9.5L16 16L3 9.5Z" style="fill:var(--accent)"></path></svg><span>Berk<span class="lm-2">Certel</span></span></a>
    <nav class="nav-links" aria-label="Ana menü">
      <a class="{{c.work}}" href="Work.dc.html">Projeler</a>
      <a class="{{c.about}}" href="About.dc.html">Hakkımda</a>
      <a class="{{c.services}}" href="Main.dc.html">Hizmetler</a>
      <a class="{{c.blog}}" href="Blog.dc.html">Blog</a>
      <a class="{{c.contact}}" href="Contact.dc.html">İletişim</a>
    </nav>
    <div class="nav-act">
      <div class="lsw nav-lang {{langCls}}" role="group" aria-label="Dil">
        <span class="th" aria-hidden="true"></span>
        <button type="button" class="{{trOn}}" onClick="{{setTr}}" aria-pressed="{{trPressed}}">TR</button>
        <button type="button" class="{{enOn}}" onClick="{{setEn}}" aria-pressed="{{enPressed}}">EN</button>
      </div>
      <button class="icon-btn" type="button" onClick="{{toggle}}" aria-label="Temayı değiştir">
        <span class="tg tg-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></span>
        <span class="tg tg-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></span>
      </button>
      <a class="btn btn-primary nav-quote" href="Contact.dc.html">İletişime geç <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10m0 0L8.5 3.5M13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <button class="burger" type="button" onClick="{{toggleMenu}}" aria-label="Menüyü aç" aria-expanded="{{openStr}}">
        <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h16M4 15h10" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
        </sc-if>
      </button>
    </div>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{false}}">
    <nav class="menu" aria-label="Mobil menü">
      <a href="Work.dc.html">Projeler <span>01</span></a>
      <a href="About.dc.html">Hakkımda <span>02</span></a>
      <a href="Main.dc.html">Hizmetler <span>03</span></a>
      <a href="Blog.dc.html">Blog <span>04</span></a>
      <a href="Contact.dc.html">İletişim <span>05</span></a>
      <div class="menu-foot">
        <a class="btn btn-primary" href="Contact.dc.html" style="font:500 15px/1 var(--f-body);letter-spacing:0">İletişime geç</a>
        <div class="lsw {{langCls}}" role="group" aria-label="Dil">
          <span class="th" aria-hidden="true"></span>
          <button type="button" class="{{trOn}}" onClick="{{setTr}}" aria-pressed="{{trPressed}}">TR</button>
          <button type="button" class="{{enOn}}" onClick="{{setEn}}" aria-pressed="{{enPressed}}">EN</button>
        </div>
      </div>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active": {"editor": "enum", "options": ["home", "work", "about", "services", "blog", "contact", "none"], "default": "home"}, "dark": {"editor": "boolean", "default": false}, "onToggle": {"editor": null}, "$preview": {"width": 1440, "height": 400}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const open = !!s.open;
    const en = s.lang === 'en';
    const dark = !!this.props.dark;
    const a = this.props.active || 'home';
    const cls = (k) => (a === k ? 'cur' : '');
    const standalone = typeof this.props.onToggle !== 'function';
    return {
      dark: dark,
      open: open,
      closed: !open,
      openStr: open ? 'true' : 'false',
      rootClass: standalone ? ('bc-root' + (dark ? ' is-dark' : '')) : '',
      c: { work: cls('work'), about: cls('about'), services: cls('services'), blog: cls('blog'), contact: cls('contact') },
      toggle: () => { if (!standalone) this.props.onToggle(); },
      toggleMenu: () => this.setState({ open: !open }),
      langCls: en ? 'en' : '',
      trOn: en ? '' : 'on', enOn: en ? 'on' : '',
      trPressed: en ? 'false' : 'true', enPressed: en ? 'true' : 'false',
      setTr: () => this.setState({ lang: 'tr' }),
      setEn: () => this.setState({ lang: 'en' })
    };
  }
}
</script>
</body>
</html>
